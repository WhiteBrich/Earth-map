<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>三维地形互动地图 · 3D Terrain Explorer</title>

    <!-- ============================================================
         一、全局样式
         ============================================================ -->
    <style>
        /* ============================================================
           一、设计系统：配色 / 字体 / 圆角 / 阴影
           ============================================================ */
        :root {
            --bg-0: #04080f;
            --glass: rgba(10, 20, 32, 0.74);
            --glass-2: rgba(12, 24, 38, 0.94);
            --line: rgba(148, 197, 255, 0.16);
            --line-strong: rgba(148, 197, 255, 0.34);
            --text: #e8f2ff;
            --muted: #8fa9c4;
            --accent: #38bdf8;
            --accent-2: #22d3ee;
            --accent-soft: rgba(56, 189, 248, 0.16);
            --danger: #fb5c6c;
            --shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
            --radius: 14px;
            --font: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background: var(--bg-0);
        }

        /* 提高优先级，避免被 Cesium 自带样式表中的 body 字体覆盖 */
        html body {
            color: var(--text);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        #cesiumContainer { position: absolute; inset: 0; width: 100%; height: 100%; }

        /* ---------- 场景暗角：压暗四角，让界面元素浮起来 ---------- */
        #vignette {
            position: absolute; inset: 0; z-index: 2; pointer-events: none;
            background: radial-gradient(ellipse at 50% 42%,
                        rgba(0, 0, 0, 0) 52%, rgba(2, 6, 12, 0.55) 100%);
        }

        /* ============================================================
           二、顶部工具条：品牌 / 搜索 / 模式切换
           ============================================================ */
        .topbar {
            position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
            height: 70px; padding: 0 132px 0 22px;
            display: flex; align-items: center; gap: 20px;
            pointer-events: none;
            background: linear-gradient(180deg,
                        rgba(4, 9, 16, 0.94) 0%,
                        rgba(4, 9, 16, 0.68) 58%,
                        rgba(4, 9, 16, 0) 100%);
        }
        .topbar > * { pointer-events: auto; }

        .brand { display: flex; align-items: center; gap: 12px; flex: none; }
        .brand-logo {
            width: 38px; height: 38px; border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 55%, #6366f1 100%);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.38);
        }
        .brand-logo svg { width: 21px; height: 21px; }
        .brand-title { font-size: 16px; font-weight: 700; letter-spacing: 0.6px; line-height: 1.25; }
        .brand-sub {
            font-size: 9.5px; letter-spacing: 2.4px; color: var(--muted);
            text-transform: uppercase; margin-top: 1px;
        }

        /* ---------- 搜索 ---------- */
        #searchPanel { position: relative; display: flex; align-items: center; gap: 8px; }
        .search-box {
            display: flex; align-items: center; gap: 8px; height: 38px;
            padding: 0 12px; border-radius: 10px;
            background: rgba(10, 20, 32, 0.8); border: 1px solid var(--line);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box:focus-within {
            border-color: var(--line-strong);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
        }
        .search-box svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
        #searchInput {
            width: 210px; height: 100%; border: none; outline: none;
            background: transparent; color: var(--text);
            font-size: 13px; font-family: var(--font);
        }
        #searchInput::placeholder { color: #64798f; }
        #searchBtn {
            height: 38px; padding: 0 18px; border: none; border-radius: 10px;
            cursor: pointer; font-size: 13px; font-weight: 600;
            font-family: var(--font); color: #031420;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 18px rgba(56, 189, 248, 0.28);
            transition: filter 0.2s, transform 0.12s;
        }
        #searchBtn:hover { filter: brightness(1.08); }
        #searchBtn:active { transform: translateY(1px); }
        #searchBtn:disabled {
            background: rgba(255, 255, 255, 0.1); color: var(--muted);
            box-shadow: none; cursor: not-allowed;
        }

        /* ---------- 搜索结果列表 ---------- */
        #resultList {
            position: absolute; top: calc(100% + 10px); left: 0;
            width: 342px; max-height: 320px; overflow-y: auto;
            display: none; padding: 6px; border-radius: var(--radius);
            background: var(--glass-2); border: 1px solid var(--line);
            box-shadow: var(--shadow); backdrop-filter: blur(16px); z-index: 1001;
        }
        #resultList::-webkit-scrollbar { width: 6px; }
        #resultList::-webkit-scrollbar-thumb {
            background: rgba(148, 197, 255, 0.25); border-radius: 99px;
        }
        #resultList .result-item {
            padding: 10px 12px; border-radius: 9px; cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.15s;
        }
        #resultList .result-item:last-child { border-bottom: none; }
        #resultList .result-item:hover { background: var(--accent-soft); }
        #resultList .item-name { color: var(--text); font-size: 13px; font-weight: 600; }
        #resultList .item-addr { color: var(--muted); font-size: 11.5px; margin-top: 3px; line-height: 1.5; }

        /* ---------- 模式按钮 ---------- */
        .mode-group { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .mode-btn {
            display: inline-flex; align-items: center; gap: 8px; height: 38px;
            padding: 0 13px; border-radius: 10px; cursor: pointer;
            font-size: 13px; font-weight: 600; font-family: var(--font);
            color: var(--text); background: rgba(10, 20, 32, 0.8);
            border: 1px solid var(--line); transition: all 0.18s;
        }
        .mode-btn svg { width: 16px; height: 16px; }
        .mode-btn:hover { border-color: var(--line-strong); background: var(--accent-soft); color: #fff; }
        .mode-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .mode-btn .mode-state {
            font-size: 11px; font-weight: 500; padding: 1px 7px;
            border-radius: 6px; background: rgba(255, 255, 255, 0.08); color: var(--muted);
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            border-color: rgba(251, 113, 133, 0.9); color: #fff;
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.32);
        }
        .mode-btn.active .mode-state { background: rgba(255, 255, 255, 0.25); color: #fff; }

        /* ============================================================
           三、地形夸张面板
           ============================================================ */
        #terrainPanel {
            position: absolute; top: 88px; left: 22px; z-index: 999;
            width: 272px; padding: 16px 16px 14px;
            border-radius: var(--radius); background: var(--glass);
            border: 1px solid var(--line); box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }
        #terrainPanel.unsupported { opacity: 0.55; }

        .panel-head { display: flex; align-items: center; justify-content: space-between; }
        .panel-title {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; font-weight: 600; letter-spacing: 0.4px;
        }
        .panel-title svg { width: 15px; height: 15px; color: var(--accent); }
        .panel-value {
            font-size: 20px; font-weight: 700; color: var(--accent);
            font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
        }
        .panel-value small { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 2px; }

        input.slider {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 6px; margin: 15px 0 6px;
            border-radius: 99px; outline: none; cursor: pointer;
            background: linear-gradient(90deg,
                        var(--accent) 0%, var(--accent-2) var(--fill, 0%),
                        rgba(255, 255, 255, 0.12) var(--fill, 0%),
                        rgba(255, 255, 255, 0.12) 100%);
        }
        input.slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 16px; height: 16px; border-radius: 50%;
            background: #fff; border: 3px solid var(--accent);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55); cursor: grab;
        }
        input.slider::-webkit-slider-thumb:active { cursor: grabbing; }
        input.slider::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: #fff; border: 3px solid var(--accent);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55); cursor: grab;
        }
        input.slider::-moz-range-track { background: transparent; }
        input.slider:disabled { opacity: 0.4; cursor: not-allowed; }

        .slider-scale {
            display: flex; justify-content: space-between;
            font-size: 10px; color: #64798f; letter-spacing: 0.3px;
        }

        .presets { display: flex; gap: 6px; margin-top: 12px; }
        .preset {
            flex: 1; height: 26px; border-radius: 8px; cursor: pointer;
            font-size: 11px; font-family: var(--font); color: var(--muted);
            background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line);
            transition: all 0.15s;
        }
        .preset:hover { color: #fff; border-color: var(--line-strong); }
        .preset.active {
            color: #d9f2ff; background: var(--accent-soft);
            border-color: rgba(56, 189, 248, 0.55);
        }
        .preset:disabled { cursor: not-allowed; opacity: 0.5; }

        .panel-hint { margin-top: 11px; font-size: 11px; line-height: 1.7; color: var(--muted); }
        .panel-hint b { color: #cfe9ff; font-weight: 600; }

        /* ============================================================
           四、右侧导航 / 工具条
           ============================================================ */
        #navPanel {
            position: absolute; top: 88px; right: 22px; z-index: 998;
            display: flex; flex-direction: column; align-items: center;
            gap: 14px; user-select: none;
        }

        #compass {
            width: 78px; height: 78px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(10, 20, 32, 0.78); border: 1px solid var(--line);
            box-shadow: var(--shadow); cursor: grab; touch-action: none;
            backdrop-filter: blur(12px);
            transition: border-color 0.18s, box-shadow 0.18s;
        }
        #compass:hover {
            border-color: rgba(56, 189, 248, 0.7);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.28), var(--shadow);
        }
        #compass.dragging {
            cursor: grabbing; border-color: var(--accent);
            box-shadow: 0 0 22px rgba(56, 189, 248, 0.45);
        }
        #compass svg { width: 100%; height: 100%; pointer-events: none; }

        #compassReadout {
            position: absolute; top: 30px; right: 92px;
            padding: 6px 11px; border-radius: 8px;
            background: var(--glass-2); border: 1px solid var(--line-strong);
            color: #bfe9ff; font-size: 12px; line-height: 1.4;
            white-space: nowrap; pointer-events: none;
            font-variant-numeric: tabular-nums;
            opacity: 0; transform: translateX(6px);
            transition: opacity 0.16s ease, transform 0.16s ease;
        }
        #compassReadout.show { opacity: 1; transform: translateX(0); }

        .toolGroup {
            display: flex; flex-direction: column; overflow: hidden;
            border-radius: 12px; background: rgba(10, 20, 32, 0.78);
            border: 1px solid var(--line); box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }
        .toolGroup button {
            width: 46px; height: 46px;
            display: flex; align-items: center; justify-content: center;
            background: transparent; color: #dbe9f7;
            border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            font-size: 20px; line-height: 1; cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .toolGroup button:last-child { border-bottom: none; }
        .toolGroup button:hover { background: var(--accent-soft); color: var(--accent); }
        .toolGroup button.active { background: rgba(244, 63, 94, 0.85); color: #fff; }
        .toolGroup button svg { width: 21px; height: 21px; }

        /* ============================================================
           五、坐标读数 / 剖面图 / 状态提示
           ============================================================ */
        #coordHud {
            position: absolute; left: 22px; bottom: 22px; z-index: 998;
            display: flex; align-items: center; gap: 16px;
            padding: 9px 16px; border-radius: 12px;
            background: var(--glass); border: 1px solid var(--line);
            box-shadow: var(--shadow); backdrop-filter: blur(14px);
            font-size: 11.5px; color: var(--muted); letter-spacing: 0.2px;
            pointer-events: none;
        }
        #coordHud .coord-item { display: flex; align-items: baseline; gap: 6px; }
        #coordHud b {
            color: var(--text); font-weight: 600;
            font-variant-numeric: tabular-nums; min-width: 74px;
            display: inline-block;
        }
        #coordHud .divider { width: 1px; height: 12px; background: rgba(148, 197, 255, 0.16); }

        #profilePanel {
            position: absolute; left: 0; right: 0; bottom: 0; z-index: 997;
            height: 250px; display: none; flex-direction: column;
            background: linear-gradient(180deg, rgba(8, 16, 27, 0.96), rgba(6, 12, 21, 0.99));
            border-top: 1px solid var(--line-strong);
            box-shadow: 0 -18px 40px rgba(0, 0, 0, 0.45);
        }
        #profilePanel.visible { display: flex; }
        #profileHeader {
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; padding: 10px 22px;
            border-bottom: 1px solid rgba(148, 197, 255, 0.1);
        }
        .title-wrap { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
        #profileTitle {
            font-size: 13px; font-weight: 600; color: var(--text);
            letter-spacing: 0.3px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .profile-sub { font-size: 11px; color: var(--muted); white-space: nowrap; }
        #profileHeader .actions { display: flex; gap: 8px; flex: none; }
        #profileHeader button {
            height: 28px; padding: 0 12px; font-size: 12px; cursor: pointer;
            border-radius: 8px; color: #bcd6ee; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line); font-family: var(--font);
            transition: all 0.15s;
        }
        #profileHeader button:hover {
            color: #fff; border-color: var(--line-strong); background: var(--accent-soft);
        }
        #profileCanvas { display: block; width: 100%; flex: 1; min-height: 0; }

        #statusMsg {
            position: absolute; left: 50%; bottom: 30px; z-index: 1001;
            transform: translate(-50%, 10px); opacity: 0;
            padding: 10px 22px; border-radius: 99px;
            font-size: 12.5px; white-space: nowrap; max-width: 80vw;
            overflow: hidden; text-overflow: ellipsis;
            color: var(--text); background: rgba(8, 16, 27, 0.92);
            border: 1px solid var(--line); box-shadow: var(--shadow);
            backdrop-filter: blur(12px); pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        #statusMsg.show { opacity: 1; transform: translate(-50%, 0); }

        /* 剖面面板展开时，底部组件上移避让 */
        body.profile-open #statusMsg { bottom: 268px; }
        body.profile-open #coordHud { bottom: 268px; }

        /* ============================================================
           六、加载遮罩
           ============================================================ */
        #loading {
            position: fixed; inset: 0; z-index: 3000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px;
            background: radial-gradient(circle at 50% 42%, #0b1c2e 0%, #04080f 68%);
            color: var(--text);
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        #loading.hidden { opacity: 0; visibility: hidden; }
        .loader-ring {
            width: 48px; height: 48px; border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0.18);
            border-top-color: var(--accent);
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading .load-title { font-size: 15px; font-weight: 600; letter-spacing: 2.4px; }
        #loading .load-sub { font-size: 11.5px; color: var(--muted); letter-spacing: 1px; }

        /* ============================================================
           七、小屏适配
           ============================================================ */
        @media (max-width: 1180px) {
            .brand-sub { display: none; }
            #searchInput { width: 160px; }
            .mode-btn .mode-label { display: none; }
        }
        @media (max-width: 860px) {
            .brand { display: none; }
            .topbar { padding: 0 112px 0 14px; gap: 10px; }
            #terrainPanel { width: 216px; left: 14px; }
            #navPanel { right: 14px; }
            #coordHud { display: none; }
            #profilePanel { height: 220px; }
        }
    </style>

    <link rel="stylesheet"
          href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css">
</head>
<body>

<!-- ============================================================
     三、页面结构
     ============================================================ -->

<!-- ---------- 加载遮罩 ---------- -->
<div id="loading">
    <div class="loader-ring"></div>
    <div class="load-title">三维地形互动地图</div>
    <div class="load-sub">正在加载天地图影像与全球地形…</div>
</div>

<!-- ---------- 三维场景 ---------- -->
<div id="cesiumContainer"></div>
<div id="vignette"></div>

<!-- ---------- 顶部工具条：品牌 · 搜索 · 模式 ---------- -->
<header class="topbar">
    <div class="brand">
        <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#03202f" stroke-width="2.1"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 18.4 8.8 9.1l3.9 5.4 2.6-3.2 6.2 7.1Z"/>
                <path d="M2.5 21.2h19"/>
            </svg>
        </div>
        <div>
            <div class="brand-title">三维地形互动地图</div>
            <div class="brand-sub">3D Terrain Explorer</div>
        </div>
    </div>

    <div id="searchPanel" class="search-group">
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round">
                <circle cx="10.8" cy="10.8" r="6.4"/>
                <path d="M15.6 15.6 20.5 20.5"/>
            </svg>
            <input id="searchInput" type="text" placeholder="搜索地名，如：北京、广州" />
        </div>
        <button id="searchBtn">搜索</button>
        <div id="resultList"></div>
    </div>

    <div class="mode-group">
        <button id="markBtn" class="mode-btn" title="标记模式：点击地图放置标记">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21.2c3.8-4 6.4-7.4 6.4-10.4a6.4 6.4 0 0 0-12.8 0c0 3 2.6 6.4 6.4 10.4Z"/>
                <circle cx="12" cy="10.4" r="2.4"/>
            </svg>
            <span class="mode-label">标记模式</span>
            <span class="mode-state">关</span>
        </button>
        <button id="profileBtn" class="mode-btn" title="剖面图模式：点击地图选择起终点">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.8 17.6 7.8 9l4.1 4.6 2.9-4.6 6.4 8.6"/>
                <path d="M2.8 21h18.4"/>
            </svg>
            <span class="mode-label">剖面图模式</span>
            <span class="mode-state">关</span>
        </button>
    </div>
</header>

<!-- ---------- 地形夸张控制 ---------- -->
<aside id="terrainPanel">
    <div class="panel-head">
        <div class="panel-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 19h18"/>
                <path d="M6 19V9l6-4 6 4v10"/>
                <path d="M10 19v-4h4v4"/>
            </svg>
            地形夸张
        </div>
        <div class="panel-value"><span id="terrainValue">1.0</span><small>×</small></div>
    </div>

    <input id="terrainSlider" class="slider" type="range"
           min="1" max="5" step="0.1" value="1" aria-label="地形夸张倍数" />
    <div class="slider-scale"><span>1× 真实</span><span>5× 夸张</span></div>

    <div class="presets">
        <button class="preset active" data-value="1">1×</button>
        <button class="preset" data-value="1.5">1.5×</button>
        <button class="preset" data-value="2">2×</button>
        <button class="preset" data-value="3">3×</button>
        <button class="preset" data-value="5">5×</button>
    </div>

    <div class="panel-hint">
        拖动滑条实时调整<b>垂直夸张倍数</b>，让山脉、峡谷的相对高差更醒目。剖面图始终显示<b>真实海拔</b>。
    </div>
</aside>

<!-- ---------- 右侧导航工具条（指北针 + 缩放 + 量算） ---------- -->
<div id="navPanel">

    <!-- 指北针 / 视角轮盘：左键拖动旋转方位，中键拖动调整俯仰与方位 -->
    <div id="compass" title="拖动轮盘旋转方位　中键拖动调整俯仰与方位">
        <svg viewBox="0 0 100 100">
            <!-- 外圈刻度 -->
            <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
            <circle cx="50" cy="50" r="33" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
            <g stroke="rgba(255,255,255,0.35)" stroke-width="1.5">
                <line x1="50" y1="5"  x2="50" y2="15"/>
                <line x1="50" y1="85" x2="50" y2="95"/>
                <line x1="5"  y1="50" x2="15" y2="50"/>
                <line x1="85" y1="50" x2="95" y2="50"/>
            </g>
            <!-- 可旋转的指针（N 字 + 指针） -->
            <g id="compassArrow">
                <path d="M50 22 L57 46 L50 40 L43 46 Z" fill="#ff5252"/>

/* ---------- 相机控制器参数：缩放速度 / 缩放范围 / 防穿地 ---------- */
(function setupCameraController() {
    const ssc = viewer.scene.screenSpaceCameraController;

    // 限制相机与地表的最近 / 最远距离，避免镜头钻进地面
    ssc.minimumZoomDistance = 300;              // 最近 300 米
    ssc.maximumZoomDistance = MAX_CAMERA_HEIGHT;

    // 开启碰撞检测，倾斜视角时相机不会钻入山体

    // 降低滚轮缩放灵敏度（包装底层 zoomIn / zoomOut）
    if (typeof ssc.zoomIn === 'function' && typeof ssc.zoomOut === 'function') {
        const originalZoomIn  = ssc.zoomIn.bind(ssc);
        const originalZoomOut = ssc.zoomOut.bind(ssc);
        ssc.zoomIn  = function (amount) { originalZoomIn(amount * ZOOM_WHEEL_SCALE); };
        ssc.zoomOut = function (amount) { originalZoomOut(amount * ZOOM_WHEEL_SCALE); };

})();


/* ============================================================

async function initTerrain() {

        });

        hideLoading();
        viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();
        viewer.scene.globe.depthTestAgainstTerrain = false;
    }
}
initTerrain();


/* ============================================================

viewer.imageryLayers.addImageryProvider(

/* ============================================================

/* 视角复位函数：飞到中国全境 */

/* ============================================================
 * 九、通用工具：状态提示

const statusMsg = document.getElementById('statusMsg');
let statusTimer = null;

function showStatus(msg, duration = 3000) {

/* ---------- 加载遮罩：地形就绪后淡出 ---------- */
const loadingOverlay = document.getElementById('loading');
let loadingHidden = false;

function hideLoading() {
    if (loadingHidden || !loadingOverlay) return;
    loadingHidden = true;
    loadingOverlay.classList.add('hidden');

        loadingOverlay.style.display = 'none';

/* 兜底：地形服务异常时也要能进入地图 */
setTimeout(hideLoading, 7000);


/* ============================================================
 * 十、右侧工具条 ①：指北针轮盘（可拖动调整相机视角）
 *     · 左键拖动：旋转方位角
 *     · 中键拖动：同时调整方位角与俯仰角
 * ============================================================ */
const compassEl      = document.getElementById('compass');
const compassArrow   = document.getElementById('compassArrow');
const compassReadout = document.getElementById('compassReadout');

/* ---------- 指针始终指向地理正北 ---------- */
viewer.scene.postRender.addEventListener(function () {
    // 相机朝东时，北方向在屏幕左侧 → 指针反向旋转
    const deg = -Cesium.Math.toDegrees(viewer.camera.heading);
    compassArrow.setAttribute('transform', `rotate(${deg.toFixed(2)} 50 50)`);
});

/* ---------- 拖动参数 ---------- */
const COMPASS_SENSITIVITY = 0.006;                     // 每像素旋转的弧度（约 0.34°）
const COMPASS_PITCH_MAX = Cesium.Math.toRadians(-8);   // 最高俯仰：接近水平，避免镜头贴地
const COMPASS_PITCH_MIN = -Math.PI / 2;                // 最低俯仰：垂直俯视

let compassDrag = null;
let compassReadoutTimer = null;

/* 取屏幕中心对应的地表点作为环绕轴心（取不到时返回 undefined） */
function getCompassPivot() {
    const scene  = viewer.scene;
    const canvas = scene.canvas;
    const center = new Cesium.Cartesian2(canvas.clientWidth / 2, canvas.clientHeight / 2);

    const ray = viewer.camera.getPickRay(center);
    if (ray) {
        const picked = scene.globe.pick(ray, scene);
        if (picked) return picked;
    }
    return viewer.camera.pickEllipsoid(center, scene.globe.ellipsoid);
}

/* ---------- 方位 / 俯仰读数 ---------- */
function updateCompassReadout(heading, pitch) {
    if (!compassReadout) return;

    let deg = Cesium.Math.toDegrees(heading) % 360;
    if (deg < 0) deg += 360;

    compassReadout.textContent =
        `方位 ${deg.toFixed(0)}°　俯仰 ${Cesium.Math.toDegrees(pitch).toFixed(0)}°`;
    compassReadout.classList.add('show');
}

function hideCompassReadout(delay) {
    if (!compassReadout) return;
    clearTimeout(compassReadoutTimer);
    compassReadoutTimer = setTimeout(function () {
        if (!compassDrag) compassReadout.classList.remove('show');
    }, delay);
}

/* ---------- 应用新视角：绕屏幕中心的地表点旋转相机 ---------- */
function applyCompassView(drag, heading, pitch) {
    const camera = viewer.camera;

    // 限制俯仰范围，防止镜头翻转 / 贴地
    pitch = Math.min(COMPASS_PITCH_MAX, Math.max(COMPASS_PITCH_MIN, pitch));

    if (drag.pivot) {
        camera.lookAt(
            drag.pivot,
            new Cesium.HeadingPitchRange(heading, pitch, drag.range)
        );
        // 立即恢复世界坐标系，避免影响后续 flyTo / setView
        camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    } else {
        // 屏幕中心没有地表（例如正对天空）：原地转动相机
        camera.setView({
            destination: Cesium.Cartesian3.clone(camera.positionWC),
            orientation: { heading: heading, pitch: pitch, roll: 0 }
        });
    }

    updateCompassReadout(heading, pitch);
}

/* ---------- 拖动开始 ---------- */
function startCompassDrag(e) {
    // 只响应左键与中键
    if (e.button !== 0 && e.button !== 1) return;

    e.preventDefault();
    e.stopPropagation();

    // 打断正在进行的飞行，避免拖拽与飞行动画冲突
    viewer.camera.cancelFlight();

    const pivot = getCompassPivot();

    compassDrag = {
        pointerId:    e.pointerId,
        button:       e.button,
        startX:       e.clientX,
        startY:       e.clientY,
        startHeading: viewer.camera.heading,
        startPitch:   viewer.camera.pitch,
        pivot:        pivot,
        range:        pivot
            ? Math.max(Cesium.Cartesian3.distance(viewer.camera.positionWC, pivot), 50)
            : 0
    };

    compassEl.classList.add('dragging');
    clearTimeout(compassReadoutTimer);
    updateCompassReadout(compassDrag.startHeading, compassDrag.startPitch);

    if (compassEl.setPointerCapture) {
        try { compassEl.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    }
}

/* ---------- 拖动过程 ---------- */
function onCompassDragMove(e) {
    if (!compassDrag || e.pointerId !== compassDrag.pointerId) return;
    e.preventDefault();

    const dx = e.clientX - compassDrag.startX;
    const dy = e.clientY - compassDrag.startY;

    // 水平拖动：轮盘跟随鼠标方向转动（场景同步旋转）
    const heading = compassDrag.startHeading - dx * COMPASS_SENSITIVITY;

    // 中键额外控制俯仰：向下拖 → 视角抬向地平线；向上拖 → 更接近垂直俯视
    let pitch = compassDrag.startPitch;
    if (compassDrag.button === 1) {
        pitch += dy * COMPASS_SENSITIVITY;
    }

    applyCompassView(compassDrag, heading, pitch);
}

/* ---------- 拖动结束 ---------- */
function endCompassDrag(e) {
    if (!compassDrag) return;
    if (e && e.pointerId !== undefined && e.pointerId !== compassDrag.pointerId) return;

    if (compassEl.releasePointerCapture) {
        try { compassEl.releasePointerCapture(compassDrag.pointerId); } catch (err) { /* 忽略 */ }
    }

    compassDrag = null;
    compassEl.classList.remove('dragging');
    hideCompassReadout(1200);
}

compassEl.addEventListener('pointerdown', startCompassDrag);
window.addEventListener('pointermove', onCompassDragMove, { passive: false });
window.addEventListener('pointerup', endCompassDrag);
window.addEventListener('pointercancel', endCompassDrag);
window.addEventListener('blur', function () { endCompassDrag(); });

// 屏蔽中键默认行为（自动滚动等），避免拖动时浏览器介入
compassEl.addEventListener('mousedown', function (e) {
    if (e.button === 1) e.preventDefault();
});
compassEl.addEventListener('auxclick', function (e) {
    if (e.button === 1) e.preventDefault();
});


/* ============================================================
 * 十一、右侧工具条 ②：按钮式放大 / 缩小 / 重置归位
 * ============================================================ */

/* 取得当前位置允许的最低相机高度（地形高度 + 安全余量） */
function getMinAllowedHeight(lonRad, latRad) {
    let ground = 0;
    try {
        const h = viewer.scene.globe.getHeight(Cesium.Cartographic.fromRadians(lonRad, latRad));
        if (typeof h === 'number') ground = h;
    } catch (e) { /* 忽略取高失败 */ }
    return Math.max(ground + 300, MIN_CAMERA_HEIGHT);
}

/* 按倍率垂直升降相机：保持经纬度与姿态，只改高度 */
function zoomByStep(isZoomOut) {
    const camera = viewer.camera;
    const carto = Cesium.Cartographic.fromCartesian(camera.positionWC);
    if (!carto) return;

    const currentH = carto.height;
    let targetH = isZoomOut
        ? currentH * ZOOM_BUTTON_STEP
        : currentH / ZOOM_BUTTON_STEP;

    // 上限：防止拉得太远；下限：防止钻进地形
    targetH = Math.min(targetH, MAX_CAMERA_HEIGHT);
    targetH = Math.max(targetH, getMinAllowedHeight(carto.longitude, carto.latitude));

    if (Math.abs(targetH - currentH) < 1) return;

    const destination = Cesium.Cartesian3.fromRadians(
        carto.longitude, carto.latitude, targetH
    );

    camera.flyTo({
        destination: destination,
        orientation: {
            heading: camera.heading,
            pitch: camera.pitch,
            roll: 0
        },
        duration: 0.5
    });
}

document.getElementById('zoomInBtn').addEventListener('click', () => zoomByStep(false));
document.getElementById('zoomOutBtn').addEventListener('click', () => zoomByStep(true));
document.getElementById('homeBtn').addEventListener('click', () => resetToChina(1.6));


/* ============================================================
 * 十二、搜索功能
 * ============================================================ */
const searchInput = document.getElementById('searchInput');
const searchBtn   = document.getElementById('searchBtn');
const resultList  = document.getElementById('resultList');

let searchMarker = null;

function hideResultList() {
    resultList.style.display = 'none';
    resultList.innerHTML = '';
}

async function searchAdministrative(keyword) {
    const url = `https://api.tianditu.gov.cn/v2/administrative?keyword=${encodeURIComponent(keyword)}&childLevel=0&extensions=false&tk=${TIANDITU_KEY}`;
    try {
        const res = await fetch(url);
        const data = await res.json();
        const ok = data.status === 200 || data.status === 0 || data.status?.infocode === 0;
        if (ok && data.data?.district?.length > 0) {
            return data.data.district.map(item => ({
                name: item.name,
                lonlat: `${item.center.lng},${item.center.lat}`,
                address: `行政区划（${item.gb || ''}）`,
                isAdmin: true
            }));
        }
    } catch (err) { console.warn('行政区划搜索失败：', err); }
    return [];
}

async function searchPOI(keyword) {
    const postStr = {
        keyWord: keyword, level: 12, mapBound: '-180,-90,180,90',
        queryType: 1, start: 0, count: 10
    };
    const url = `https://api.tianditu.gov.cn/v2/search?postStr=${encodeURIComponent(JSON.stringify(postStr))}&type=query&tk=${TIANDITU_KEY}`;
    try {
        const res = await fetch(url);
        const data = await res.json();
        const statusCode = data.status?.infocode || data.status;
        if (statusCode !== 0 && statusCode !== '0' && statusCode !== 1000) return [];
        const pois = data.pois || data.result || [];
        return pois.map(item => {
            let lon = 0, lat = 0;
            if (item.lonlat) {
                const parts = item.lonlat.split(',');
                lon = parseFloat(parts[0]); lat = parseFloat(parts[1]);
            }
            return {
                name: item.name || item.keyword || '未知地点',
                lonlat: `${lon},${lat}`,
                address: item.address || '',
                isAdmin: false
            };
        });
    } catch (err) { console.warn('POI搜索失败：', err); return []; }
}

async function doSearch() {
    const keyword = searchInput.value.trim();
    if (!keyword) { showStatus('请输入搜索关键词'); return; }

    searchBtn.disabled = true;
    searchBtn.textContent = '搜索中...';
    hideResultList();
    showStatus('正在搜索...', 0);

    let results = await searchAdministrative(keyword);
    if (results.length === 0) results = await searchPOI(keyword);

    if (results.length === 0) {
        showStatus('未找到相关地点，请尝试其他关键词');
        searchBtn.disabled = false;
        searchBtn.textContent = '搜索';
        return;
    }

    renderResults(results);
    showStatus(`找到 ${results.length} 个结果，点击条目跳转`);
    searchBtn.disabled = false;
    searchBtn.textContent = '搜索';
}

function renderResults(results) {
    resultList.innerHTML = '';
    results.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'result-item';
        const [lon, lat] = item.lonlat.split(',').map(Number);
        const tag = item.isAdmin ? '【行政区划】' : '';
        div.innerHTML = `
            <div class="item-name">${index + 1}. ${tag}${item.name}</div>
            <div class="item-addr">${item.address || `经度 ${lon.toFixed(4)}°　纬度 ${lat.toFixed(4)}°`}</div>
        `;
        div.addEventListener('click', () => {
            flyToLocation(lon, lat, item.name, item.isAdmin);
            hideResultList();
            searchInput.value = item.name;
        });
        resultList.appendChild(div);
    });
    resultList.style.display = 'block';
}

function flyToLocation(lon, lat, name, isAdmin) {
    if (searchMarker) { viewer.entities.remove(searchMarker); searchMarker = null; }
    searchMarker = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(lon, lat),
        point: {
            pixelSize: 12, color: Cesium.Color.RED,
            outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
            disableDepthTestDistance: Number.POSITIVE_INFINITY
        },
        label: {
            text: name, font: 'bold 14px "Microsoft YaHei", sans-serif',
            fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2, style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            pixelOffset: new Cesium.Cartesian2(0, -24),
            eyeOffset: new Cesium.Cartesian3(0, 0, -50000)
        }
    });
    const height = isAdmin ? 200000 : 8000;
    viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(lon, lat, height),
        orientation: {
            heading: Cesium.Math.toRadians(0),
            pitch: Cesium.Math.toRadians(isAdmin ? -60 : -65),
            roll: 0
        },
        duration: 5,
        complete: () => showStatus(`已定位到：${name}`, 2000)
    });
}

const profileBtn       = document.getElementById('profileBtn');

let profileMode = false;

let profileRubberLine = null;  // 鼠标移动预览线

/* ---------- 剖面图绘制核心 ---------- */
function drawProfile(lon1, lat1, lon2, lat2, positions) {
    profilePanel.classList.add('visible');
    document.body.classList.add('profile-open');

    // 适配 canvas 分辨率
    const dpr = window.devicePixelRatio || 1;
    const cssW = profileCanvas.clientWidth;
    const cssH = profileCanvas.clientHeight;
    profileCanvas.width = cssW * dpr;
    profileCanvas.height = cssH * dpr;

    const ctx = profileCanvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const W = cssW, H = cssH;
    ctx.clearRect(0, 0, W, H);

    // 距离计算
    const geodesic = new Cesium.EllipsoidGeodesic(
        Cesium.Cartographic.fromDegrees(lon1, lat1),
        Cesium.Cartographic.fromDegrees(lon2, lat2)
    );
    const totalDistKm = geodesic.surfaceDistance / 1000;

    // 海拔范围
    const heights = positions.map(p => p.height);
    const minH = Math.min(...heights);
    const maxH = Math.max(...heights);
    const rangeH = Math.max(maxH - minH, 1);

    const padding = { top: 36, right: 30, bottom: 30, left: 60 };
    const plotW = W - padding.left - padding.right;
    const plotH = H - padding.top - padding.bottom;

    const xOf = i => padding.left + (i / (positions.length - 1)) * plotW;
    const yOf = h => padding.top + plotH - ((h - minH) / rangeH) * plotH;

    // 背景网格
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
        const y = padding.top + (plotH * i / 5);
        ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(padding.left + plotW, y); ctx.stroke();
    }

    // 填充区域（渐变）
    ctx.beginPath();
    ctx.moveTo(xOf(0), yOf(positions[0].height));
    for (let i = 1; i < positions.length; i++) {
        ctx.lineTo(xOf(i), yOf(positions[i].height));
    }
    ctx.lineTo(xOf(positions.length - 1), padding.top + plotH);
    ctx.lineTo(xOf(0), padding.top + plotH);
    ctx.closePath();
    const gradient = ctx.createLinearGradient(0, padding.top, 0, padding.top + plotH);
    gradient.addColorStop(0, 'rgba(79, 195, 247, 0.75)');
    gradient.addColorStop(1, 'rgba(79, 195, 247, 0.1)');
    ctx.fillStyle = gradient;
    ctx.fill();

    // 轮廓线
    ctx.beginPath();
    ctx.moveTo(xOf(0), yOf(positions[0].height));
    for (let i = 1; i < positions.length; i++) {
        ctx.lineTo(xOf(i), yOf(positions[i].height));
    }
    ctx.strokeStyle = '#4fc3f7';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Y 轴刻度
    ctx.fillStyle = '#aaa';
    ctx.font = '11px "Microsoft YaHei"';
    ctx.textAlign = 'right';
    for (let i = 0; i <= 5; i++) {
        const h = minH + (rangeH * i / 5);
        const y = yOf(h);
        ctx.fillText(h.toFixed(0) + 'm', padding.left - 8, y + 4);
    }

    // X 轴刻度
    ctx.textAlign = 'center';
    for (let i = 0; i <= 5; i++) {
        const d = totalDistKm * i / 5;
        const x = padding.left + (plotW * i / 5);
        ctx.fillText(d.toFixed(1) + 'km', x, padding.top + plotH + 18);
    }

    // 起点终点标记
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText('起点', xOf(0), padding.top - 10);
    ctx.textAlign = 'right';
    ctx.fillText('终点', xOf(positions.length - 1), padding.top - 10);

    // 顶部统计信息
    ctx.fillStyle = '#4fc3f7';
    ctx.font = 'bold 13px "Microsoft YaHei"';
    ctx.textAlign = 'left';
    ctx.fillText(
        `水平距离：${totalDistKm.toFixed(2)} km　|　海拔：${minH.toFixed(0)} ~ ${maxH.toFixed(0)} m　|　相对高差：${(maxH - minH).toFixed(0)} m`,
        padding.left, 22
    );

    profileTitle.textContent = `地形剖面图  ${lat1.toFixed(2)}°N ${lon1.toFixed(2)}°E  →  ${lat2.toFixed(2)}°N ${lon2.toFixed(2)}°E`;
}

/* ---------- 采样并绘制 ---------- */
async function sampleAndDrawProfile(lon1, lat1, lon2, lat2) {
    showStatus('正在采样地形，请稍候...', 0);

    const SAMPLE_COUNT = 100;
    const cartographics = [];
    for (let i = 0; i < SAMPLE_COUNT; i++) {
        const t = i / (SAMPLE_COUNT - 1);
        const lon = lon1 + (lon2 - lon1) * t;
        const lat = lat1 + (lat2 - lat1) * t;
        cartographics.push(Cesium.Cartographic.fromDegrees(lon, lat));
    }

    try {
        let sampled;
        if (globalTerrainProvider) {
            sampled = await Cesium.sampleTerrainMostDetailed(
                globalTerrainProvider,
                cartographics
            );
        } else {
            sampled = cartographics.map(c => { c.height = 0; return c; });
            showStatus('提示：地形服务未加载，剖面图为平地', 4000);
        }
        drawProfile(lon1, lat1, lon2, lat2, sampled);
        if (globalTerrainProvider) showStatus('剖面图已生成', 2000);
    } catch (err) {
        console.error('地形采样失败：', err);
        showStatus('地形采样失败，请检查 Cesium ion Token', 4000);
    }
}


/* ============================================================
 * 十五、量算工具：距离量算 / 面积量算 / 清除
 * ============================================================ */
const distanceBtn     = document.getElementById('distanceBtn');
const areaBtn         = document.getElementById('areaBtn');
const clearMeasureBtn = document.getElementById('clearMeasureBtn');

let measureMode = null;          // null | 'distance' | 'area'
let measurePoints = [];          // 当前正在量算的顶点 [{lon, lat}]
let measureEntities = [];        // 当前量算的图形实体
let finishedEntities = [];       // 已结束量算的图形实体
let measurePreviewEntity = null; // 鼠标移动时的预览线

/* ---------- 数值计算辅助 ---------- */

/* 折线总长（米），使用椭球测地线距离 */
function calcTotalDistance(points) {
    let total = 0;
    for (let i = 1; i < points.length; i++) {
        const g = new Cesium.EllipsoidGeodesic(
            Cesium.Cartographic.fromDegrees(points[i - 1].lon, points[i - 1].lat),
            Cesium.Cartographic.fromDegrees(points[i].lon, points[i].lat)
        );
        total += g.surfaceDistance;
    }
    return total;
}

/* 球面多边形面积（平方米） */
function calcPolygonArea(points) {
    if (points.length < 3) return 0;
    const R = 6378137.0;
    let sum = 0;
    for (let i = 0; i < points.length; i++) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];
        const lon1 = Cesium.Math.toRadians(p1.lon);
        const lat1 = Cesium.Math.toRadians(p1.lat);
        const lon2 = Cesium.Math.toRadians(p2.lon);
        const lat2 = Cesium.Math.toRadians(p2.lat);
        sum += (lon2 - lon1) * (2 + Math.sin(lat1) + Math.sin(lat2));
    }
    return Math.abs(sum * R * R / 2);
}

function formatDistance(m) {
    return m >= 1000 ? (m / 1000).toFixed(3) + ' km' : m.toFixed(1) + ' m';
}
function formatArea(m2) {
    return m2 >= 1e6 ? (m2 / 1e6).toFixed(4) + ' km²' : m2.toFixed(1) + ' m²';
}

/* ---------- 图形绘制 ---------- */
function updateMeasureGraphics() {
    // 清除上一轮绘制的图形
    measureEntities.forEach(e => viewer.entities.remove(e));
    measureEntities = [];
    if (measurePreviewEntity) {
        viewer.entities.remove(measurePreviewEntity);
        measurePreviewEntity = null;
    }

    if (measurePoints.length === 0) return;

    const cartesians = measurePoints.map(p => Cesium.Cartesian3.fromDegrees(p.lon, p.lat));

    // 顶点小球
    measurePoints.forEach(p => {
        measureEntities.push(viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(p.lon, p.lat),
            point: {
                pixelSize: 9,
                color: Cesium.Color.YELLOW,
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 1.5,
                disableDepthTestDistance: Number.POSITIVE_INFINITY
            }
        }));
    });

    // 距离量算：折线
    if (measureMode === 'distance' && measurePoints.length >= 2) {
        measureEntities.push(viewer.entities.add({
            polyline: {
                positions: cartesians,
                width: 3,
                material: Cesium.Color.CYAN,
                clampToGround: true
            }
        }));
    }

    // 面积量算：多边形 + 闭合边
    if (measureMode === 'area' && measurePoints.length >= 2) {
        const ring = cartesians.concat([cartesians[0]]);
        measureEntities.push(viewer.entities.add({
            polyline: {
                positions: ring,
                width: 2,
                material: Cesium.Color.CYAN,
                clampToGround: true
            }
        }));
        if (measurePoints.length >= 3) {
            measureEntities.push(viewer.entities.add({
                polygon: {
                    hierarchy: cartesians,
                    material: Cesium.Color.CYAN.withAlpha(0.3),
                    perPositionHeight: false
                }
            }));
        }
    }

    // 结果标签（跟随最后一个顶点）
    const last = measurePoints[measurePoints.length - 1];
    let text = '点击继续取点';
    if (measureMode === 'distance') {
        text = measurePoints.length >= 2
            ? '总长：' + formatDistance(calcTotalDistance(measurePoints))
            : '起点';
    } else {
        text = measurePoints.length >= 3
            ? '面积：' + formatArea(calcPolygonArea(measurePoints))
            : '取点中（≥3点成面）';
    }

    measureEntities.push(viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(last.lon, last.lat),
        label: {
            text: text,
            font: 'bold 14px "Microsoft YaHei", sans-serif',
            fillColor: Cesium.Color.WHITE,
            showBackground: true,
            backgroundColor: new Cesium.Color(0.0, 0.0, 0.0, 0.75),
            backgroundPadding: new Cesium.Cartesian2(8, 5),
            pixelOffset: new Cesium.Cartesian2(0, -34),
            disableDepthTestDistance: Number.POSITIVE_INFINITY
        }
    }));
}

/* ---------- 添加顶点 ---------- */
function addMeasurePoint(lon, lat) {
    measurePoints.push({ lon, lat });
    updateMeasureGraphics();

    if (measureMode === 'distance' && measurePoints.length >= 2) {
        showStatus('当前总长度：' + formatDistance(calcTotalDistance(measurePoints)) + '（右键结束本次量算）', 3000);
    } else if (measureMode === 'area' && measurePoints.length >= 3) {
        showStatus('当前面积：' + formatArea(calcPolygonArea(measurePoints)) + '（右键结束本次量算）', 3000);
    }
}

/* ---------- 结束当前量算（保留图形） ---------- */
function finishMeasure() {
    if (measurePreviewEntity) {
        viewer.entities.remove(measurePreviewEntity);
        measurePreviewEntity = null;
    }
    if (measurePoints.length === 0) return;

    finishedEntities = finishedEntities.concat(measureEntities);
    measureEntities = [];
    measurePoints = [];
    showStatus('本次量算已结束，可继续点击开始新的量算', 2500);
}

/* ---------- 清除全部量算 ---------- */
function clearAllMeasure() {
    measureEntities.forEach(e => viewer.entities.remove(e));
    measureEntities = [];
    finishedEntities.forEach(e => viewer.entities.remove(e));
    finishedEntities = [];
    if (measurePreviewEntity) {
        viewer.entities.remove(measurePreviewEntity);
        measurePreviewEntity = null;
    }
    measurePoints = [];
}

/* ---------- 切换量算模式 ---------- */
function setMeasureMode(mode) {
    const nextMode = (measureMode === mode) ? null : mode;

    // 开启量算时，先关闭标记 / 剖面模式
    if (nextMode) {
        if (markMode) toggleMarkMode();
        if (profileMode) toggleProfileMode();
    }

    measureMode = nextMode;
    clearAllMeasure();

    distanceBtn.classList.toggle('active', measureMode === 'distance');
    areaBtn.classList.toggle('active', measureMode === 'area');
    viewer.scene.canvas.style.cursor = measureMode ? 'crosshair' : 'default';

    if (measureMode === 'distance') {
        showStatus('距离量算：单击地图依次取点，右键结束本次量算', 3500);
    } else if (measureMode === 'area') {
        showStatus('面积量算：单击地图依次取点（≥3 点成面），右键结束本次量算', 3500);
    } else {
        showStatus('已退出量算模式', 2000);
    }
}

/* ---------- 鼠标移动时的量算预览线 ---------- */
function updateMeasurePreview(endPosition) {
    const ray = viewer.camera.getPickRay(endPosition);
    if (!ray) return;
    const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
    if (!cartesian) return;

    const c = Cesium.Cartographic.fromCartesian(cartesian);
    const lon = Cesium.Math.toDegrees(c.longitude);
    const lat = Cesium.Math.toDegrees(c.latitude);
    const last = measurePoints[measurePoints.length - 1];

    if (measurePreviewEntity) viewer.entities.remove(measurePreviewEntity);

    const arr = measurePoints.concat([{ lon, lat }]);
    const flat = [];
    arr.forEach(p => flat.push(p.lon, p.lat));

    measurePreviewEntity = viewer.entities.add({
        polyline: {
            positions: Cesium.Cartesian3.fromDegreesArray(flat),
            width: 2,
            material: new Cesium.PolylineDashMaterialProperty({
                color: Cesium.Color.CYAN.withAlpha(0.85),
                dashLength: 12
            }),
            clampToGround: true
        }
    });
}

/* ---------- 按钮事件 ---------- */
distanceBtn.addEventListener('click', () => setMeasureMode('distance'));
areaBtn.addEventListener('click', () => setMeasureMode('area'));
clearMeasureBtn.addEventListener('click', () => {
    clearAllMeasure();
    showStatus('已清除全部量算结果', 2000);
});


/* ============================================================
 * 十六、鼠标事件总入口：标记 / 剖面 / 量算 / 信息
 * ============================================================ */
const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

/* ---------- 左键单击 ---------- */
handler.setInputAction(async function (click) {

    const ray = viewer.camera.getPickRay(click.position);
    if (!ray) return;

    const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
    if (!cartesian) {
        showStatus('未拾取到地表位置，请点击地球表面', 3000);
        return;
    }

    const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
    const lon = Cesium.Math.toDegrees(cartographic.longitude);
    const lat = Cesium.Math.toDegrees(cartographic.latitude);

    /* ========== ① 量算模式（优先级最高） ========== */
    if (measureMode) {
        addMeasurePoint(lon, lat);
        return;
    }

    /* ========== ② 剖面图模式 ========== */
    if (profileMode) {
        profilePoints.push({ lon, lat });

        const pointEntity = viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(lon, lat),
            point: {
                pixelSize: 10,
                color: profilePoints.length === 1 ? Cesium.Color.LIME : Cesium.Color.ORANGE,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2,
                disableDepthTestDistance: Number.POSITIVE_INFINITY
            }
        });
        profileEntities.push(pointEntity);

        if (profilePoints.length === 1) {
            showStatus('起点已选，请点击终点位置', 3000);
            return;
        }

        const p1 = profilePoints[0];
        const p2 = profilePoints[1];

        const lineEntity = viewer.entities.add({
            polyline: {
                positions: Cesium.Cartesian3.fromDegreesArray([p1.lon, p1.lat, p2.lon, p2.lat]),
                width: 3,
                material: Cesium.Color.YELLOW,
                arcType: Cesium.ArcType.GEODESIC,
                clampToGround: true
            }
        });
        profileEntities.push(lineEntity);

        if (profileRubberLine) {
            viewer.entities.remove(profileRubberLine);
            profileRubberLine = null;
        }

        await sampleAndDrawProfile(p1.lon, p1.lat, p2.lon, p2.lat);
        profilePoints = [];
        return;
    }

    /* ========== ③ 标记模式 ========== */
    if (markMode) {
        const idx = userMarkers.length + 1;
        const marker = viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(lon, lat),
            point: {
                pixelSize: 14, color: Cesium.Color.ORANGE,
                outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
                disableDepthTestDistance: Number.POSITIVE_INFINITY
            },
            label: {
                text: `标记 ${idx}`,
                font: 'bold 14px "Microsoft YaHei", sans-serif',
                fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK,
                outlineWidth: 2, style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                pixelOffset: new Cesium.Cartesian2(0, -24),
                eyeOffset: new Cesium.Cartesian3(0, 0, -50000)
            }
        });
        userMarkers.push(marker);
        showStatus(`标记 ${idx}：经度 ${lon.toFixed(4)}°　纬度 ${lat.toFixed(4)}°`, 3000);
        return;
    }

    /* ========== ④ 普通信息模式 ========== */
    showStatus(`经度 ${lon.toFixed(4)}°　纬度 ${lat.toFixed(4)}°　正在获取海拔...`, 0);
    if (globalTerrainProvider) {
        try {
            const sampled = await Cesium.sampleTerrainMostDetailed(
                globalTerrainProvider,
                [Cesium.Cartographic.fromDegrees(lon, lat)]
            );
            showStatus(`经度 ${lon.toFixed(4)}°　纬度 ${lat.toFixed(4)}°　海拔 ${sampled[0].height.toFixed(1)} 米`, 4000);
            return;
        } catch (err) { console.warn('地形采样失败：', err); }
    }
    showStatus(`经度 ${lon.toFixed(4)}°　纬度 ${lat.toFixed(4)}°　海拔 ${cartographic.height.toFixed(1)} 米（近似）`, 4000);

}, Cesium.ScreenSpaceEventType.LEFT_CLICK);

/* ---------- 右键单击：结束当前量算 ---------- */
handler.setInputAction(function () {
    if (measureMode) finishMeasure();
}, Cesium.ScreenSpaceEventType.RIGHT_CLICK);

/* ---------- 鼠标移动：剖面预览线 + 量算预览线 ---------- */
handler.setInputAction(function (movement) {

    // 剖面图预览线
    if (profileMode && profilePoints.length === 1) {
        const ray = viewer.camera.getPickRay(movement.endPosition);
        if (ray) {
            const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
            if (cartesian) {
                const c = Cesium.Cartographic.fromCartesian(cartesian);
                const lon = Cesium.Math.toDegrees(c.longitude);
                const lat = Cesium.Math.toDegrees(c.latitude);
                const p1 = profilePoints[0];

                if (profileRubberLine) viewer.entities.remove(profileRubberLine);
                profileRubberLine = viewer.entities.add({
                    polyline: {
                        positions: Cesium.Cartesian3.fromDegreesArray([p1.lon, p1.lat, lon, lat]),
                        width: 2,
                        material: new Cesium.PolylineDashMaterialProperty({
                            color: Cesium.Color.YELLOW.withAlpha(0.7),
                            dashLength: 12
                        }),
                        arcType: Cesium.ArcType.GEODESIC,
                        clampToGround: true
                    }
                });
            }
        }
    }

    // 量算预览线
    if (measureMode && measurePoints.length > 0) {
        updateMeasurePreview(movement.endPosition);
    }

    // 鼠标位置经纬度 / 海拔读数
    updateCoordHud(movement.endPosition);

}, Cesium.ScreenSpaceEventType.MOUSE_MOVE);


/* ============================================================
 * 十七、地形夸张（Vertical Exaggeration）
 *     · Cesium ≥ 1.116：scene.verticalExaggeration
 *     · 旧版本回退：scene.terrainExaggeration
 * ============================================================ */
(function setupTerrainExaggeration() {
    const scene   = viewer.scene;
    const slider  = document.getElementById('terrainSlider');
    const valueEl = document.getElementById('terrainValue');
    const panelEl = document.getElementById('terrainPanel');
    const presetBtns = Array.prototype.slice.call(
        document.querySelectorAll('#terrainPanel .preset')
    );

    const EXAG_MIN = 1;
    const EXAG_MAX = 5;

    const hasVertical = 'verticalExaggeration' in scene;
    const hasLegacy   = 'terrainExaggeration' in scene;

    let currentValue = 1;
    let rafId = 0;

    /* ---------- 写入 Cesium 场景 ---------- */
    function writeToScene(value) {
        try {
            if (hasVertical) {
                scene.verticalExaggeration = value;
                return true;
            }
            if (hasLegacy) {
                scene.terrainExaggeration = value;
                return true;
            }
        } catch (err) {
            console.warn('地形夸张设置失败：', err);
        }
        return false;
    }

    /* ---------- 同步滑条 / 数值 / 预设按钮 ---------- */
    function renderExaggerationUI(value) {
        if (valueEl) valueEl.textContent = value.toFixed(1);

        if (slider) {
            if (Math.abs(parseFloat(slider.value) - value) > 0.001) {
                slider.value = String(value);
            }
            const percent = ((value - EXAG_MIN) / (EXAG_MAX - EXAG_MIN)) * 100;
            slider.style.setProperty('--fill', percent.toFixed(2) + '%');
        }

        presetBtns.forEach(function (btn) {
            const v = parseFloat(btn.dataset.value);
            btn.classList.toggle('active', Math.abs(v - value) < 0.05);
        });
    }

    /* ---------- 应用夸张倍数 ---------- */
    function applyExaggeration(value) {
        currentValue = Math.min(EXAG_MAX, Math.max(EXAG_MIN, value));
        writeToScene(currentValue);
        renderExaggerationUI(currentValue);
    }

    /* ---------- 拖动时按帧节流：避免频繁重建地形网格 ---------- */
    function scheduleExaggeration(value) {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(function () {
            rafId = 0;
            applyExaggeration(value);
        });
    }

    if (!hasVertical && !hasLegacy) {
        if (slider) slider.disabled = true;
        presetBtns.forEach(function (btn) { btn.disabled = true; });
        if (panelEl) panelEl.classList.add('unsupported');
        showStatus('当前 Cesium 版本不支持地形夸张', 4000);
        return;
    }

    if (slider) {
        slider.addEventListener('input', function () {
            scheduleExaggeration(parseFloat(slider.value));
        });
        slider.addEventListener('change', function () {
            showStatus('地形夸张：' + currentValue.toFixed(1) + '×', 1800);
        });
    }

    presetBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
            applyExaggeration(parseFloat(btn.dataset.value));
            showStatus('地形夸张：' + currentValue.toFixed(1) + '×', 1800);
        });
    });

    /* 初始状态：真实地形（1×） */
    applyExaggeration(1);
    console.log('✅ 地形夸张控制已就绪（1× - 5×）');
})();


/* ============================================================
 * 十八、鼠标位置：经纬度 / 海拔读数
 * ============================================================ */
const coordLonEl = document.getElementById('coordLon');
const coordLatEl = document.getElementById('coordLat');
const coordAltEl = document.getElementById('coordAlt');

let coordHudAt = 0;

function formatLonLat(deg, posSuffix, negSuffix) {
    return Math.abs(deg).toFixed(4) + '° ' + (deg >= 0 ? posSuffix : negSuffix);
}

function updateCoordHud(screenPos) {
    if (!coordLonEl) return;

    const now = performance.now();
    if (now - coordHudAt < 90) return;
    coordHudAt = now;

    const ray = viewer.camera.getPickRay(screenPos);
    if (!ray) return;

    const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
    if (!cartesian) return;

    const carto = Cesium.Cartographic.fromCartesian(cartesian);
    const lon = Cesium.Math.toDegrees(carto.longitude);
    const lat = Cesium.Math.toDegrees(carto.latitude);

    coordLonEl.textContent = formatLonLat(lon, 'E', 'W');
    coordLatEl.textContent = formatLonLat(lat, 'N', 'S');

    let height = null;
    try {
        height = viewer.scene.globe.getHeight(carto);
    } catch (err) {
        height = null;
    }

    coordAltEl.textContent = (typeof height === 'number')
        ? Math.round(height) + ' m'
        : '—';
}

console.log('✅ 三维地形互动底图初始化完成');
</script>
