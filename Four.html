<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>三维地球 · 昼夜与时区</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #cesiumContainer { width: 100%; height: 100%; }

        /* 时间信息面板 */
        #timePanel {
            position: absolute;
            top: 20px;
            right: 20px;
            min-width: 260px;
            background: rgba(20, 30, 40, 0.88);
            color: #fff;
            padding: 16px 20px;
            border-radius: 8px;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.8;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            z-index: 999;
        }
        #timePanel.visible { opacity: 1; }
        #timePanel .time-main {
            font-size: 24px;
            font-weight: 600;
            color: #4fc3f7;
            margin: 6px 0;
        }
        #timePanel .coord { color: #aaa; font-size: 12px; }

        /* 时区开关按钮 */
        #toggleTimezone {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            background: rgba(20, 30, 40, 0.88);
            color: #fff;
            border: 1px solid #4fc3f7;
            border-radius: 4px;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #toggleTimezone:hover {
            background: rgba(79, 195, 247, 0.3);
        }
    </style>

    <!-- 引入 Cesium 的 CSS -->
    <link rel="stylesheet"
          href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css">
</head>
<body>
    <!-- 三维地球容器 -->
    <div id="cesiumContainer"></div>

    <!-- 时间信息面板 -->
    <div id="timePanel">
        <div>点击位置当地时间</div>
        <div class="time-main" id="localTime">--:--:--</div>
        <div id="localDate">----年--月--日</div>
        <div class="coord" id="coordInfo"></div>
    </div>

    <!-- 时区开关按钮 -->
    <button id="toggleTimezone">显示/隐藏时区</button>

    <!-- 引入 Cesium 的 JS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"></script>

    <!-- ================= 你自己的代码 ================= -->
    <script>
        // 禁用 Cesium Ion，避免不必要的网络请求
        Cesium.Ion.defaultAccessToken = '';

        // ---------- 1. 初始化 Viewer ----------
        const viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            sceneModePicker: false,
            navigationHelpButton: false,
            animation: false,
            timeline: false,
            fullscreenButton: false,
            infoBox: false,
            selectionIndicator: false,
            baseLayer: false,               // 不用默认底图，稍后手动加载天地图
            terrainProvider: new Cesium.EllipsoidTerrainProvider()
        });

        // 开启地形深度测试（确保地球背面的物体被遮挡）
        viewer.scene.globe.depthTestAgainstTerrain = true;

        // ---------- 2. 加载天地图影像底图 ----------
        const TIANDITU_KEY = '67202ad0231a8193b8cdda3816077687';
        const subdomains = ['0','1','2','3','4','5','6','7'];

        const tdtImgProvider = new Cesium.WebMapTileServiceImageryProvider({
            url: `https://t{s}.tianditu.gov.cn/img_w/wmts?tk=${TIANDITU_KEY}`,
            layer: 'img', style: 'default', format: 'tiles',
            tileMatrixSetID: 'w', subdomains: subdomains,
            maximumLevel: 18
        });
        viewer.imageryLayers.addImageryProvider(tdtImgProvider);

        // ---------- 3. 加载天地图中文注记 ----------
        const tdtCiaProvider = new Cesium.WebMapTileServiceImageryProvider({
            url: `https://t{s}.tianditu.gov.cn/cia_w/wmts?tk=${TIANDITU_KEY}`,
            layer: 'cia', style: 'default', format: 'tiles',
            tileMatrixSetID: 'w', subdomains: subdomains,
            maximumLevel: 18
        });
        viewer.imageryLayers.addImageryProvider(tdtCiaProvider);

        // ---------- 4. 设置初始视角 ----------
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(105, 35, 20000000)
        });

        // ---------- 5. 开启昼夜光照 ----------
        viewer.scene.globe.enableLighting = true;

                        // ---------- 6. 绘制时区多边形、经线与标签 ----------
        const timezoneEntities = [];

        // 多边形不透明度（0 = 完全透明，1 = 完全不透明）
        const POLYGON_OPACITY = 0.3;

        for (let lon = -180; lon < 180; lon += 15) {
            const centerLon = lon + 7.5;
            const tzOffset = Math.round(centerLon / 15);

            let tzLabel = '';
            if (tzOffset === 0) tzLabel = '中时区';
            else if (tzOffset > 0) tzLabel = '东' + tzOffset + '区';
            else tzLabel = '西' + Math.abs(tzOffset) + '区';

            const hue = (tzOffset + 12) * 15;
            const bgColor = Cesium.Color.fromHsl(hue / 360, 0.6, 0.7, POLYGON_OPACITY);

            const latMin = -80, latMax = 80;
            const rightLon = Math.min(lon + 15, 179.999);

            // ---- 6.1 多边形 ----
            const polygonPositions = [];
            for (let lat = latMin; lat <= latMax; lat += 1) {
                polygonPositions.push(lon, lat);
            }
            for (let lat = latMax; lat >= latMin; lat -= 1) {
                polygonPositions.push(rightLon, lat);
            }
            timezoneEntities.push(viewer.entities.add({
                polygon: {
                    hierarchy: Cesium.Cartesian3.fromDegreesArray(polygonPositions),
                    material: bgColor,
                    classificationType: Cesium.ClassificationType.TERRAIN,
                    outline: false
                }
            }));

            // ---- 6.2 经线 ----
            const linePositions = [];
            for (let lat = latMin; lat <= latMax; lat += 1) {
                linePositions.push(lon, lat);
            }
            timezoneEntities.push(viewer.entities.add({
                polyline: {
                    positions: Cesium.Cartesian3.fromDegreesArray(linePositions),
                    width: 1,
                    material: Cesium.Color.YELLOW.withAlpha(0.6),
                    arcType: Cesium.ArcType.GEODESIC
                }
            }));

            // ---- 6.3 标签（置顶） ----
            timezoneEntities.push(viewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(centerLon, 5),
                label: {
                    text: tzLabel,
                    font: 'bold 16px "Microsoft YaHei", sans-serif',
                    fillColor: Cesium.Color.WHITE,
                    outlineColor: Cesium.Color.BLACK,
                    outlineWidth: 3,
                    style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                    pixelOffset: new Cesium.Cartesian2(0, -10),
                    eyeOffset: new Cesium.Cartesian3(0, 0, -50000)
                }
            }));
        }

        // ---------- 6.4 国际日期变更线 ----------
        const dateLinePositions = [];
        for (let lat = -80; lat <= 80; lat += 1) {
            dateLinePositions.push(180, lat);
        }
        timezoneEntities.push(viewer.entities.add({
            polyline: {
                positions: Cesium.Cartesian3.fromDegreesArray(dateLinePositions),
                width: 2,
                material: new Cesium.PolylineDashMaterialProperty({
                    color: Cesium.Color.RED,
                    dashLength: 16
                }),
                arcType: Cesium.ArcType.GEODESIC
            }
        }));

        // ---------- 7. 按钮控制时区显隐 ----------
        let timezoneVisible = true;
        document.getElementById('toggleTimezone').addEventListener('click', function () {
            timezoneVisible = !timezoneVisible;
            timezoneEntities.forEach(entity => {
                entity.show = timezoneVisible;
            });
        });

        // ---------- 8. 时间显示更新函数 ----------
        function updateTimeDisplay(data) {
    if (!data) return;

    const { lon, lat, tzOffsetHours } = data;

    // 当前 UTC 时间戳
    const utcMs = Date.now();

    // 当地时间 = UTC + 时区偏移（本质是"加上偏移后的绝对时刻"）
    const localMs = utcMs + tzOffsetHours * 3600000;
    const localDate = new Date(localMs);

    const pad = n => String(n).padStart(2, '0');

    // ✅ 用 UTC 方法读取，避免叠加浏览器本地时区
    const timeStr = `${pad(localDate.getUTCHours())}:${pad(localDate.getUTCMinutes())}:${pad(localDate.getUTCSeconds())}`;
    const dateStr = `${localDate.getUTCFullYear()}年${pad(localDate.getUTCMonth() + 1)}月${pad(localDate.getUTCDate())}日`;

    let offsetStr = '';
    if (tzOffsetHours === 0) offsetStr = '中时区';
    else if (tzOffsetHours > 0) offsetStr = '东' + tzOffsetHours + '区';
    else offsetStr = '西' + Math.abs(tzOffsetHours) + '区';

    document.getElementById('localTime').textContent = timeStr;
    document.getElementById('localDate').textContent = dateStr;
    document.getElementById('coordInfo').textContent =
        `经度 ${lon.toFixed(2)}°　纬度 ${lat.toFixed(2)}°　${offsetStr}`;
}

        // ---------- 9. 鼠标点击事件 ----------
        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        let lastClickData = null;

        handler.setInputAction(function (click) {
            let cartesian = viewer.scene.pickPosition(click.position);

            if (!cartesian) {
                const ray = viewer.camera.getPickRay(click.position);
                if (ray) {
                    cartesian = viewer.scene.globe.ellipsoid.pick(ray, viewer.scene);
                }
            }

            if (cartesian) {
                const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
                const lon = Cesium.Math.toDegrees(cartographic.longitude);
                const lat = Cesium.Math.toDegrees(cartographic.latitude);

                const tzOffsetHours = Math.max(-12, Math.min(14, Math.round(lon / 15)));

                lastClickData = { lon, lat, tzOffsetHours };
                updateTimeDisplay(lastClickData);
                document.getElementById('timePanel').classList.add('visible');
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        // ---------- 10. 每秒刷新时间 ----------
        setInterval(function () {
            if (lastClickData) {
                updateTimeDisplay(lastClickData);
            }
        }, 1000);
    </script>
</body>
</html>
